# Netlify build configuration.
#
# The site is a static Vite build with no server side and no router, so
# this is deliberately minimal: build, publish, and a couple of headers.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Pinned so Netlify does not pick a different major than the one this
  # was built and tested against. Vite 5 and the TypeScript build need
  # a modern Node; 22 is what it is developed on.
  NODE_VERSION = "22"

# Long-lived caching for the hashed build output. Vite fingerprints
# every file in /assets, so these can never go stale.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The 3D model, Draco decoder and fonts are large and never change
# without a filename change, so they are safe to cache hard too.
[[headers]]
  for = "/models/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/draco/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Modest security headers. No CSP: the site loads Google Fonts and
# decodes a WASM Draco decoder, and a wrong CSP would break both
# silently.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
